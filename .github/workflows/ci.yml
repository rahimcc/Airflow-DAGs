name: CI

on:
    pull_request:
        branches: [main]
    push:
        branches: [main]


jobs:
    validate:
        runs-on: self-hosted
        
        steps:
          - uses: actions/checkout@v4


          - name: Set up virtualenv
            run: |
                python3 -m venv .venv
                . .venv/bin/activate
                pip install --upgrade pip
                pip install -r requirements-ci.txt

          - name: Lint
            run: | 
                . .venv/bin/activate
                ruff check dags/
          - name: DAG import test
            run: |
                . .venv/bin/activate
                python -c " from airflow.models import DagBag
                    d = DagBag('dags/', include_examples=False)
                    if d.import_errors:
                        for filename, error in d.import_errors.items():
                            print(f'--- {filename} ---')
                            print(error)
                        raise SystemExit('Import errors found')
                    print(f'{len(d.dags)} DAG(s) imported cleanly: {list(d.dags.keys())}')
                    "

